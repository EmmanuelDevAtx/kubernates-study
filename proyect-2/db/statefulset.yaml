apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-statefulset
  namespace: development
spec:
  serviceName: "db"
  replicas: 2
  selector:
    matchLabels:
      app: db-app
  template:
    metadata:
      labels:
        app: db-app
    spec:
      containers:
        - name: db
          image: postgres:13-alpine
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/postgresql/data
          envFrom:
            - secretRef:
                name: db-secret
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: db-pvc